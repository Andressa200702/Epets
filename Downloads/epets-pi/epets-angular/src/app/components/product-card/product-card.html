<article class="pcard">
  <a class="ph" [routerLink]="['/produto', product().id]" [attr.aria-label]="'Ver ' + product().name">
    <app-product-img [product]="product()" />
    @if (soldOut()) {
      <span class="tag bad">Indisponível</span>
    } @else if (low()) {
      <span class="tag warn">Últimas unidades</span>
    }
  </a>
  <span class="cat">{{ label() }}</span>
  <h3><a [routerLink]="['/produto', product().id]">{{ product().name }}</a></h3>
  <span class="det">{{ product().detail }}</span>
  <div class="price">{{ product().price | currency: 'BRL' }}</div>
  <button class="btn block" type="button" (click)="add()" [disabled]="soldOut() || inCart() >= product().stock">
    @if (soldOut()) {
      Indisponível
    } @else if (inCart() > 0) {
      Na sacola ({{ inCart() }}) · adicionar mais
    } @else {
      Adicionar à sacola
      <svg class="ico" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    }
  </button>
</article>
